# SPDX-License-Identifier: Apache-2.0
name: Repair Holographic v7 bootstrap once

on:
  push:
    branches:
      - feat/holographic-v7-brain-quant-v1-20260904
    paths:
      - .github/workflows/repair-holographic-v7-once.yml

permissions:
  contents: write

concurrency:
  group: anatomy-holographic-v7-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-v7-brain-quant-v1-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact test toolchain
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r requirements.txt "pytest==8.3.5" "httpx>=0.27,<1"

      - name: Reconcile the complete source-native binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def save(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8", newline="\n")

          dockerfile = Path("Dockerfile")
          docker = dockerfile.read_text(encoding="utf-8")
          for old in ("living_runtime:app", "second_brain_runtime:app", "server:app"):
              docker = docker.replace(old, "frontier_runtime:app")
          if "frontier_runtime:app" not in docker:
              raise SystemExit("frontier runtime entrypoint is absent")
          save(dockerfile, docker)

          publisher_path = Path("scripts/sync_hf_creator_profile.py")
          publisher = publisher_path.read_text(encoding="utf-8")
          if '"frontier_runtime.py"' not in publisher and "'frontier_runtime.py'" not in publisher:
              anchors = ('"second_brain_runtime.py",', "'second_brain_runtime.py',")
              for anchor in anchors:
                  position = publisher.find(anchor)
                  if position < 0:
                      continue
                  line_start = publisher.rfind("\n", 0, position) + 1
                  indent = publisher[line_start:position]
                  quote = anchor[0]
                  publisher = publisher.replace(
                      anchor,
                      anchor + f"\n{indent}{quote}frontier_runtime.py{quote},",
                      1,
                  )
                  break
              else:
                  raise SystemExit("creator publisher whitelist anchor is absent")
          if not any(token in publisher for token in ('"*.js"', "'*.js'")):
              raise SystemExit("creator publisher excludes root JavaScript")
          if not any(token in publisher for token in ('"*.css"', "'*.css'")):
              raise SystemExit("creator publisher excludes root CSS")
          save(publisher_path, publisher)

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          style = '<link rel="stylesheet" href="/holographic-v7.css" data-szl-holographic-v7="style" />'
          script = '<script src="/holographic-v7.js" defer data-szl-holographic-v7="script"></script>'
          if 'data-szl-holographic-v7="style"' not in index:
              position = index.lower().rfind("</head>")
              if position < 0:
                  raise SystemExit("index front door has no closing head")
              index = index[:position] + "  " + style + "\n" + index[position:]
          if 'data-szl-holographic-v7="script"' not in index:
              position = index.lower().rfind("</body>")
              if position < 0:
                  raise SystemExit("index front door has no closing body")
              index = index[:position] + "  " + script + "\n" + index[position:]
          if index.count('data-szl-holographic-v7="style"') != 1:
              raise SystemExit("v7 stylesheet is not mounted exactly once")
          if index.count('data-szl-holographic-v7="script"') != 1:
              raise SystemExit("v7 script is not mounted exactly once")
          save(index_path, index)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace("SZLHOLDINGS/anatomy", "betterwithage/anatomy")
          marker = "<!-- SZL-HOLOGRAPHIC-V7:START -->"
          if marker not in readme:
              readme = readme.rstrip() + """

<!-- SZL-HOLOGRAPHIC-V7:START -->
## Holographic v7 — Brain · Formula · Quant · Ouroboros

Holographic v7 binds the existing 3D organism to the exact protected-main public
snapshot of `szl-holdings/szl-second-brain`. The creator-profile runtime at
[`betterwithage/anatomy`](https://huggingface.co/spaces/betterwithage/anatomy)
materializes the original **575 handles** plus a content-addressed, review-gated
frontier candidate set.

The instrument exposes source handles and receipts for **30 attributed formulas**,
**21 executable formula functions**, and **nine quant domains**, together with the
Ouroboros review-loop tissue. The F-number-to-executable mapping stays
`UNKNOWN_NOT_INFERRED`, the locked-proven count stays exactly eight, and Lambda stays
**Conjecture 1**.

Public endpoints return `HANDLES_ONLY`; candidate content remains inside the read-only
runtime. No private graph is loaded. No raw graph node enters gradients. No weight is
trained, no claim is promoted, and no tool or provider action is executed. The
continuous Second Brain and Codex/Ouroboros loops generate human-review proposals;
they do not silently convert discovery into truth or action.

The v7 HUD is a contextual overlay inside Living Anatomy—not another product shell or
global navigation. It uses same-origin GET requests, local assets, bounded polling,
keyboard focus containment, mobile safe areas, reduced-motion handling, and
forced-color support.
<!-- SZL-HOLOGRAPHIC-V7:END -->
"""
          if "SZLHOLDINGS/anatomy" in readme:
              raise SystemExit("retired organization Space remains in README")
          save(readme_path, readme)

          witness_path = Path(".github/workflows/holographic-v7-live-witness.yml")
          witness = witness_path.read_text(encoding="utf-8")
          witness = witness.replace('assert formulas["returned_count"] >= 60', 'assert formulas["returned_count"] >= 48')
          save(witness_path, witness)
          PY
          git diff --check

      - name: Materialize the exact current Second Brain snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .runtime/second-brain
          python scripts/materialize_second_brain.py --output .runtime/second-brain
          test -s .runtime/second-brain/frontier-state.v1.json
          test -s .runtime/second-brain/frontier-candidates.public.jsonl
          test -s .runtime/second-brain/source.json

      - name: Prove the complete source and local runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/materialize_second_brain.py \
            scripts/sync_hf_creator_profile.py \
            frontier_runtime.py \
            living_runtime.py \
            second_brain_runtime.py
          node --check holographic-v7.js
          python -m pytest -q

          python -m uvicorn frontier_runtime:app --host 127.0.0.1 --port 7860 > /tmp/anatomy-v7.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:7860/api/anatomy/v1/holographic-v7 \
              > /tmp/holographic-v7.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:7860/api/anatomy/v1/frontier/status \
            > /tmp/frontier-status.json
          curl --fail --silent --show-error \
            'http://127.0.0.1:7860/api/anatomy/v1/frontier/formulas?k=48' \
            > /tmp/frontier-formulas.json
          python - <<'PY'
          import json
          from pathlib import Path

          v7 = json.loads(Path("/tmp/holographic-v7.json").read_text())
          status = json.loads(Path("/tmp/frontier-status.json").read_text())
          formulas = json.loads(Path("/tmp/frontier-formulas.json").read_text())
          assert v7["ready"] is True
          assert v7["state"] == "SOURCE_BOUND_READ_ONLY"
          assert all(value is False for key, value in v7["claims"].items() if key != "human_review_required")
          assert v7["claims"]["human_review_required"] is True
          atlas = status["formula_atlas"]
          assert atlas["attributed_formula_count"] == 30
          assert atlas["executable_formula_count"] == 21
          assert atlas["quant_domain_count"] == 9
          assert atlas["locked_proven_formula_count"] == 8
          assert status["lambda"] == "CONJECTURE_1"
          assert formulas["content_access"] == "HANDLES_ONLY"
          assert formulas["returned_count"] == 48
          for path in ("/tmp/holographic-v7.json", "/tmp/frontier-status.json", "/tmp/frontier-formulas.json"):
              body = Path(path).read_text().lower()
              assert '"content"' not in body
              assert '"text"' not in body
          PY
          git diff --check

      - name: Commit the repaired v7 binding and remove bootstrap controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add Dockerfile README.md index.html scripts/sync_hf_creator_profile.py \
            .github/workflows/holographic-v7-live-witness.yml
          for path in \
            .github/workflows/materialize-holographic-v7-once.yml \
            .github/workflows/repair-holographic-v7-once.yml; do
            if [ -e "$path" ]; then
              git rm -f "$path"
            fi
          done
          git diff --cached --quiet && { echo "no v7 reconciliation changes"; exit 1; }
          git commit -s -m "feat(anatomy): finalize source-bound holographic v7"
          git push origin HEAD:feat/holographic-v7-brain-quant-v1-20260904
