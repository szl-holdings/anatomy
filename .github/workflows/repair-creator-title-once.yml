name: Repair creator publication title once
on:
  push:
    branches: [fix/creator-publication-title-contract-20260905]
    paths: [.github/workflows/repair-creator-title-once.yml]
permissions:
  contents: write
concurrency:
  group: anatomy-creator-title-repair-once
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'szl-holdings/anatomy' && github.ref == 'refs/heads/fix/creator-publication-title-contract-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reproduce the source contract failure, then change only the publisher prefix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/sync_hf_creator_profile.py)" = c01482442406a420e60dbd1514e3413e1638c3f6
          python -S - <<'PY'
          import subprocess, sys
          command = [sys.executable, '-S', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_creator_publication_title.py', '-v']
          before = subprocess.run(command, capture_output=True, text=True, timeout=30)
          print(before.stdout + before.stderr)
          if before.returncode == 0 or 'committed publisher emits a title rejected by the runtime' not in before.stderr:
              raise SystemExit('Expected real publisher/runtime mismatch was not reproduced')
          from pathlib import Path
          path = Path('scripts/sync_hf_creator_profile.py')
          text = path.read_text(encoding='utf-8')
          old = 'f"hf-sync: creator profile source {source_revision} "'
          new = 'f"hf-sync: source {source_revision} "'
          if text.count(old) != 1:
              raise SystemExit('Exact publisher message changed; preserve concurrent work')
          path.write_text(text.replace(old, new), encoding='utf-8')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          subprocess.run(command, check=True, timeout=30)
          print('RED/GREEN: actual publisher expression now satisfies the unchanged runtime verifier; nine tests pass.')
          PY
          git diff --exit-code -- server.py
          git diff --check
          test "$(git diff --name-only)" = scripts/sync_hf_creator_profile.py
      - name: Commit only the tested publisher change to its unchanged branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/creator-publication-title-contract-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git add -- scripts/sync_hf_creator_profile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(anatomy): match creator publication metadata to runtime source contract'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
