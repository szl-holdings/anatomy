# SPDX-License-Identifier: Apache-2.0
name: Reconcile Anatomy Holographic v7 once

on:
  push:
    branches:
      - feat/holographic-v7-brain-quant-v1-20260904
    paths:
      - .github/workflows/reconcile-holographic-v7-once.yml
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-anatomy-holographic-v7-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-v7-brain-quant-v1-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Require merged continuous Brain authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api repos/szl-holdings/szl-second-brain/pulls/8 --jq '.merged')"
          test "$merged" = true || { echo "::error::Second Brain PR #8 is not merged."; exit 20; }
          brain_main="$(gh api repos/szl-holdings/szl-second-brain/commits/main --jq '.sha')"
          [[ "$brain_main" =~ ^[0-9a-f]{40}$ ]]
          echo "BRAIN_MAIN_SHA=$brain_main" >> "$GITHUB_ENV"

      - name: Reconcile current Anatomy main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge -X ours --no-ff origin/main \
              -m "chore(anatomy): reconcile protected main ${main_sha:0:12}" \
              -m "Preserve Holographic v7 while incorporating the complete current Living Anatomy lineage and rematerializing the final continuous Brain source." \
              -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Semantic conflicts remain."
            git diff --name-only --diff-filter=U
            exit 21
          fi
          git merge-base --is-ancestor "$main_sha" HEAD
          while IFS= read -r -d '' path; do
            test -e "$path" || { echo "::error::Anatomy main path disappeared: $path"; exit 22; }
          done < <(git ls-tree -r -z --name-only "$main_sha")

      - name: Materialize exact final Second Brain source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime/second-brain
          python scripts/materialize_second_brain.py --output .runtime/second-brain
          test -s .runtime/second-brain/manifest.json
          test -s .runtime/second-brain/brain-corpus.public.jsonl
          test -s .runtime/second-brain/frontier-state.v1.json
          test -s .runtime/second-brain/frontier-candidates.public.jsonl
          test -s .runtime/second-brain/source.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path('.runtime/second-brain/source.json').read_text(encoding='utf-8'))
          encoded = json.dumps(source, sort_keys=True)
          expected = os.environ['BRAIN_MAIN_SHA']
          assert expected in encoded, (expected, source)
          manifest = json.loads(Path('.runtime/second-brain/manifest.json').read_text(encoding='utf-8'))
          assert manifest
          state = json.loads(Path('.runtime/second-brain/frontier-state.v1.json').read_text(encoding='utf-8'))
          assert state.get('candidate_set_sha256')
          assert state.get('candidate_count', 0) > 0
          PY

      - name: Prove combined source and Holographic v7 contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements.txt "pytest==8.3.5" "httpx>=0.27,<1"
          python -m py_compile frontier_runtime.py scripts/materialize_second_brain.py
          node --check holographic-v7.js
          python -m pytest -q \
            tests/test_frontier_runtime.py \
            tests/test_holographic_v7_contract.py
          python - <<'PY'
          from pathlib import Path
          source = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.py','.js','.css','.html','.json','.md'}
          )
          for marker in (
              'Holographic v7',
              'HANDLES_ONLY',
              'UNKNOWN_NOT_INFERRED',
              'CONJECTURE_1',
              'raw_graph_nodes_admitted_to_gradients',
              '/api/anatomy/v1/frontier/status',
              '/api/anatomy/v1/holographic-v7',
          ):
              assert marker in source, marker
          PY
          git diff --check

      - name: Remove temporary workflows and publish final feature head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/reconcile-holographic-v7-once.yml \
            .github/workflows/materialize-holographic-v7-once.yml \
            .github/workflows/repair-holographic-v7-once.yml; do
            if [ -e "$path" ]; then git rm -f "$path"; fi
          done
          git add -A
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s -m "feat(anatomy): finalize source-bound Holographic v7"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:feat/holographic-v7-brain-quant-v1-20260904
          gh pr merge 61 --repo szl-holdings/anatomy --auto --squash --match-head-commit "$final_sha"
