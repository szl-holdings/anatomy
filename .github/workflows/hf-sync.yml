name: Sync Living Anatomy to creator profile

# GitHub protected main is authoritative. Creative experiences publish to
# Stephen's public Hugging Face profile; the SZLHOLDINGS organization remains
# reserved for flagships, verticals, and shared vertical infrastructure.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anatomy-hf-creator-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned publisher and test tools
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.23.0"

      - name: Compile the source-owned runtime and publisher
        run: |
          python -m py_compile \
            server.py \
            living_runtime.py \
            frontier_runtime.py \
            second_brain_runtime.py \
            scripts/materialize_second_brain.py \
            scripts/sync_hf_creator_profile.py
          node --check neural-quant-v7.js
          node --check holographic-v7.js

      - name: Fail closed if Hugging Face credential is absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"

      - name: Materialize exact public Second Brain and frontier memory
        run: python scripts/materialize_second_brain.py --output .runtime/second-brain

      - name: Re-prove the full local Neural Quant v7 contract
        run: python -m unittest discover -s tests -v

      - name: Publish and verify betterwithage/anatomy
        run: python scripts/sync_hf_creator_profile.py
