name: Sync to HuggingFace Space

# Mirrors this repo's served files and Docker runtime to the live Hugging Face
# Space (SZLHOLDINGS/anatomy) on every push to main, so the Space never drifts
# behind GitHub. It uses huggingface_hub.create_commit (git-free, no LFS, no
# orphan-mirror) — the same drift-safe path proven on a11oy/killinchu, which
# avoids the dangling-LFS / pre-receive / missing-front-matter failures that
# broke earlier git-push mirrors.
#
# It mirrors only the tracked runtime and front-door files required by this
# Docker Space. The Space's .github/ directory remains untouched. README.md is
# uploaded verbatim because it carries the HF Space front-matter.
#
# Requires repo secret HF_TOKEN (HF write token with org write to SZLHOLDINGS).
# Without it the job FAILS LOUDLY with a founder-action message — it never fakes
# a sync.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anatomy-hf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub==1.23.0"
      - name: Mirror runtime and front-door files to the Space
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: SZLHOLDINGS/anatomy
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set — cannot sync the Space."
            echo "::error::Founder action required: add repo secret HF_TOKEN (HF write token, org write to SZLHOLDINGS)."
            exit 1
          fi
          python3 <<'PYEOF'
          import glob
          import json
          import os
          import time
          import urllib.request
          from huggingface_hub import HfApi, CommitOperationAdd

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]

          # Runtime and served files. The Space's .github/ remains untouched.
          patterns = ["README.md", "Dockerfile", ".dockerignore", "server.py",
                      "*.html",
                      "*.js", "*.css", "lib/**/*"]
          files = []
          for p in patterns:
              files += [f for f in glob.glob(p, recursive=True) if os.path.isfile(f)]
          files = sorted(set(files))
          if not files:
              print("No front-door files matched — nothing to sync.")
              raise SystemExit(0)

          ops = []
          for f in files:
              with open(f, "rb") as fh:
                  ops.append(CommitOperationAdd(path_in_repo=f, path_or_fileobj=fh.read()))
          source_revision = os.environ.get("GITHUB_SHA", "").lower()
          if len(source_revision) != 40 or any(
              character not in "0123456789abcdef" for character in source_revision
          ):
              raise RuntimeError("GITHUB_SHA is not an exact Git revision")
          source_ref = os.environ.get("GITHUB_REF")
          if source_ref != "refs/heads/main":
              raise RuntimeError(
                  f"refusing production deploy from non-main ref: {source_ref!r}"
              )
          workflow_run_id = os.environ.get("GITHUB_RUN_ID", "")
          if not workflow_run_id.isdigit():
              raise RuntimeError("GITHUB_RUN_ID is not a numeric workflow run ID")
          deploy_manifest = {
              "schema": "szl.hf-deploy-manifest/v1",
              "source_repository": "szl-holdings/anatomy",
              "source_revision": source_revision,
              "source_path": "",
              "destination": {
                  "repo_id": space,
                  "repo_type": "space",
                  "mode": "runtime-whitelist",
              },
              "workflow_run_id": workflow_run_id,
          }
          ops.append(
              CommitOperationAdd(
                  path_in_repo="hf-deploy-manifest.json",
                  path_or_fileobj=(
                      json.dumps(deploy_manifest, sort_keys=True, indent=2) + "\n"
                  ).encode("utf-8"),
              )
          )

          github_repo = os.environ.get("GITHUB_REPOSITORY")
          if github_repo != "szl-holdings/anatomy":
              raise RuntimeError(f"unexpected GitHub repository: {github_repo!r}")
          github_token = os.environ.get("GITHUB_TOKEN", "")
          if not github_token:
              raise RuntimeError("GITHUB_TOKEN is not available")
          request = urllib.request.Request(
              os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              + f"/repos/{github_repo}/commits/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {github_token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              current_main = str(json.load(response).get("sha") or "").lower()
          if current_main != source_revision:
              raise RuntimeError(
                  "refusing stale production deploy at mutation boundary: "
                  f"current_main={current_main!r} source_revision={source_revision!r}"
              )

          print("Syncing", len(ops), "file(s) to", space, ":", files)
          commit = api.create_commit(
              repo_id=space, repo_type="space", operations=ops,
              commit_message=f"hf-sync: source {source_revision} run {workflow_run_id}",
          )
          print("Space commit:", getattr(commit, "commit_url", commit))

          target_sha = commit.oid
          deadline = time.monotonic() + 480
          while time.monotonic() < deadline:
              info = api.space_info(space)
              runtime = api.get_space_runtime(space)
              stage = getattr(runtime.stage, "value", str(runtime.stage))
              print("Observed Space:", info.sha, stage)
              if info.sha == target_sha:
                  if stage == "RUNNING":
                      break
                  if stage in {"BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"}:
                      raise RuntimeError(f"Space reached {stage} at target revision {target_sha}")
              time.sleep(10)
          else:
              raise TimeoutError(f"Space did not reach RUNNING at {target_sha} within 480 seconds")

          base = "https://szlholdings-anatomy.hf.space"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=10) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(base + "/version", timeout=10) as response:
                      version = json.load(response)
                  with urllib.request.urlopen(base + "/evidence?refresh=1", timeout=15) as response:
                      evidence = json.load(response)
                  with urllib.request.urlopen(
                      base + "/.well-known/szl-source.json?refresh=1", timeout=10
                  ) as response:
                      source = json.load(response)
                  assert health["transport_state"] == "REACHABLE"
                  assert health["verification_state"] == "STRUCTURAL_ONLY"
                  assert version["schemaVersion"] == "szl.vertical-conformance.version.v1"
                  assert version["gitSha"] == source_revision
                  assert version["deploymentRevision"] == target_sha
                  assert version["evidenceState"] == "MEASURED"
                  assert evidence["schemaVersion"] == "szl.vertical-conformance.evidence.v1"
                  assert evidence["gitSha"] == source_revision
                  assert evidence["evidenceState"] == "PARTIAL"
                  assert evidence["source"]["deployment"]["hf_revision"] == target_sha
                  assert evidence["receipts"][0]["status"] == "STRUCTURAL_ONLY"
                  assert evidence["outputProvenance"]["authenticityEstablished"] is False
                  assert source["deployment"]["hf_revision"] == target_sha
                  assert source["source"]["commit"] == source_revision
                  assert source["alignment_state"] == "SOURCE_BOUND_DEPLOYMENT"
                  assert source["deployment"]["workflow_run_id"] == workflow_run_id
                  print("Verified live Space revision and health:", target_sha)
                  break
              except Exception as error:
                  if attempt == 11:
                      raise RuntimeError("Public Space verification failed") from error
                  time.sleep(5)
          PYEOF
