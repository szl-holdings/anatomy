# SPDX-License-Identifier: Apache-2.0
name: Finalize Anatomy after Brain once

on:
  push:
    branches:
      - feat/holographic-v7-brain-quant-v1-20260904
    paths:
      - .github/workflows/finalize-anatomy-after-brain-once.yml
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-anatomy-after-brain-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact Anatomy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-v7-brain-quant-v1-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for continuous Brain merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1500 ))
          while true; do
            merged="$(gh api repos/szl-holdings/szl-second-brain/pulls/8 --jq '.merged')"
            if [ "$merged" = true ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Second Brain PR #8 did not merge within the bounded dependency window."
              exit 40
            fi
            sleep 20
          done
          brain_sha="$(gh api repos/szl-holdings/szl-second-brain/commits/main --jq '.sha')"
          [[ "$brain_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "BRAIN_MAIN_SHA=$brain_sha" >> "$GITHUB_ENV"

      - name: Reconcile current Anatomy main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge -X ours --no-ff origin/main \
              -m "chore(anatomy): reconcile current main ${main_sha:0:12}" \
              -m "Preserve Holographic v7 while incorporating the complete Living Anatomy main lineage before exact Brain rematerialization." \
              -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor "$main_sha" HEAD
          while IFS= read -r -d '' path; do
            test -e "$path" || { echo "::error::Current-main path disappeared: $path"; exit 41; }
          done < <(git ls-tree -r -z --name-only "$main_sha")

      - name: Materialize and verify exact merged Brain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime/second-brain
          python scripts/materialize_second_brain.py --output .runtime/second-brain
          for path in \
            .runtime/second-brain/manifest.json \
            .runtime/second-brain/brain-corpus.public.jsonl \
            .runtime/second-brain/frontier-state.v1.json \
            .runtime/second-brain/frontier-candidates.public.jsonl \
            .runtime/second-brain/source.json; do
            test -s "$path"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path('.runtime/second-brain/source.json').read_text(encoding='utf-8'))
          assert os.environ['BRAIN_MAIN_SHA'] in json.dumps(source, sort_keys=True)
          state = json.loads(Path('.runtime/second-brain/frontier-state.v1.json').read_text(encoding='utf-8'))
          assert len(state['candidate_set_sha256']) == 64
          assert state['candidate_count'] > 0
          assert state['source_count'] >= 6
          PY

      - name: Run complete Holographic v7 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r requirements.txt "pytest==8.3.5" "httpx>=0.27,<1"
          python -m py_compile frontier_runtime.py scripts/materialize_second_brain.py
          node --check holographic-v7.js
          python -m pytest -q \
            tests/test_frontier_runtime.py \
            tests/test_holographic_v7_contract.py
          python - <<'PY'
          from pathlib import Path
          source = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for p in Path('.').rglob('*')
              if p.is_file() and p.suffix in {'.py','.js','.css','.html','.json','.md'}
          )
          for marker in (
              'HANDLES_ONLY','UNKNOWN_NOT_INFERRED','CONJECTURE_1',
              '/api/anatomy/v1/frontier/status','/api/anatomy/v1/holographic-v7',
              'raw_graph_nodes_admitted_to_gradients'
          ):
              assert marker in source, marker
          PY
          git diff --check

      - name: Remove one-use machinery, push, and request exact protected merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/reconcile-holographic-v7-once.yml \
            .github/workflows/finalize-anatomy-after-brain-once.yml \
            .github/workflows/materialize-holographic-v7-once.yml \
            .github/workflows/repair-holographic-v7-once.yml; do
            if [ -e "$path" ]; then git rm -f "$path"; fi
          done
          git add -A
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s -m "feat(anatomy): finalize source-bound Holographic v7"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:feat/holographic-v7-brain-quant-v1-20260904
          gh pr merge 61 --repo szl-holdings/anatomy \
            --auto --squash --match-head-commit "$final_sha"
