# SPDX-License-Identifier: Apache-2.0
name: Patch Anatomy no-op publisher once

on:
  push:
    branches:
      - feat/neural-quant-anatomy-v7-20260904
    paths:
      - .github/workflows/patch-anatomy-noop-publisher-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/neural-quant-anatomy-v7-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned publisher dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.23.0"

      - name: Add exact no-op deployment convergence
        shell: bash
        env:
          FUNCTIONS_B64: 
          NOOP_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          publisher = Path("scripts/sync_hf_creator_profile.py")
          text = publisher.read_text(encoding="utf-8")
          functions = base64.b64decode(os.environ["FUNCTIONS_B64"]).decode("utf-8")
          noop = base64.b64decode(os.environ["NOOP_B64"]).decode("utf-8")
          function_marker = "\ndef wait_running(api: HfApi, target_sha: str, timeout_seconds: int = 900) -> None:\n"
          if "def live_deploy_manifest()" not in text:
              if text.count(function_marker) != 1:
                  raise SystemExit("wait_running insertion marker is not unique")
              text = text.replace(function_marker, functions + function_marker, 1)
          operations_marker = "\n    operations = [\n"
          if "NOOP: exact Anatomy, Brain, frontier" not in text:
              if text.count(operations_marker) != 1:
                  raise SystemExit("operations insertion marker is not unique")
              text = text.replace(operations_marker, "\n" + noop + operations_marker, 1)
          publisher.write_text(text, encoding="utf-8", newline="\n")
          Path("tests/test_publisher_noop.py").write_bytes(
              base64.b64decode(os.environ["TEST_B64"])
          )
          PY
          python -m py_compile scripts/sync_hf_creator_profile.py
          python scripts/materialize_second_brain.py --output .runtime/second-brain
          python -m unittest discover -s tests -v
          node --check neural-quant-v7.js
          git diff --check

      - name: Commit durable no-op publisher behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/sync_hf_creator_profile.py tests/test_publisher_noop.py
          git diff --cached --quiet && { echo "no publisher changes"; exit 1; }
          git commit -s -m "perf(anatomy): preserve exact deployed revisions on no-op sync"
          git push origin HEAD:feat/neural-quant-anatomy-v7-20260904
