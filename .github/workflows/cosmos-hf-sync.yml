name: Cosmos canonical publication
on:
  pull_request:
    paths: ['spaces/cosmos/**', 'scripts/sync_cosmos.py', 'tests/test_cosmos_publisher.py', '.github/workflows/cosmos-hf-sync.yml']
  push:
    branches: [main]
    paths: ['spaces/cosmos/**', 'scripts/sync_cosmos.py', 'tests/test_cosmos_publisher.py', '.github/workflows/cosmos-hf-sync.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cosmos-canonical-hf-publisher
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_cosmos_publisher.py -v
      - run: python -m unittest discover -s tests -v
        working-directory: spaces/cosmos
      - run: node --input-type=module --check < app.js && node --input-type=module --check < catalog-ui.js
        working-directory: spaces/cosmos
      - run: node --test tests/test_source_verification.cjs
        working-directory: spaces/cosmos
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.23.0'
      - run: python scripts/sync_cosmos.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cosmos-publication-receipt
          path: cosmos-publication-receipt.json
          if-no-files-found: error
